[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unlimited-ocr-rag"
version = "0.1.0"
description = "OCR + RAG pipeline built on Baidu Unlimited-OCR, faithful to the Medium article by Gao Dalie, with a CPU fallback and pluggable LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William" }]
keywords = ["ocr", "rag", "langchain", "unlimited-ocr", "baidu", "faiss"]

# Core deps needed for the RAG pipeline + CPU fallback path.
# GPU / real Unlimited-OCR extras live in [project.optional-dependencies].
dependencies = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langchain-text-splitters>=0.2",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.6",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Real Baidu Unlimited-OCR (needs an NVIDIA GPU + CUDA at runtime).
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.46",
    "einops>=0.8",
    "addict>=2.4",
    "easydict>=1.13",
    "psutil>=6.0",
]
# CPU fallback OCR engine (no system binary, pip-only).
fallback = [
    "rapidocr-onnxruntime>=1.3",
]
# Streamlit chat UI.
ui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
uocr-rag = "unlimited_ocr_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
